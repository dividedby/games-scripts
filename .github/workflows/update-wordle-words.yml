name: update Wordle word lists

# Once a month, refresh Wordle Shortlist's word lists from WordGamesBot (NYT WordleBot's
# lists). If they changed, open a pull request with the new lists, a version bump and a
# changelog line. Nothing is released until that pull request is merged into main.
#
# The pull request is opened with the workflow token, and a push or pull request made with
# that token starts no workflow runs, so `ci-ok` and `format` (which main's ruleset requires)
# would never report on it. The last step starts test.yml and format.yml on the branch by
# workflow_dispatch, the one event that token may trigger; their checks land on the pull
# request's head commit.
on:
  schedule:
    - cron: "17 14 1 * *" # the 1st of each month, 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: words
        run: pnpm update-words
      - if: steps.words.outputs.changed == 'true'
        run: pnpm test
      - if: steps.words.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-wordle-words
          delete-branch: true
          author: dividedby <64715420+dividedby@users.noreply.github.com>
          committer: dividedby <64715420+dividedby@users.noreply.github.com>
          commit-message: "Wordle Shortlist: update word lists from NYT WordleBot"
          title: "Wordle Shortlist: update word lists"
          body: |
            The word lists at [WordGamesBot](https://github.com/WordGamesBot/wordgamesbot.github.io) changed:

            ${{ steps.words.outputs.summary }}

            Tests passed. Merging this releases the new version.
      - name: Run the required checks on the pull request
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run test.yml --ref update-wordle-words
          gh workflow run format.yml --ref update-wordle-words
